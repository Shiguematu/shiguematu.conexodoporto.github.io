<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚓ Conexo do Porto</title>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --tile:#334155;
    --tile-hover:#475569;
    --selected:#f59e0b;
    --text:#f8fafc;

    --yellow:#facc15;
    --green:#4ade80;
    --blue:#60a5fa;
    --purple:#c084fc;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}
a:link {
font-size: 18px;
font-weight: bold;
color: white;
}


body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:900px;
}
.containera {
  display: grid;
  grid-template-columns: auto auto auto;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.stat{
    flex:1;
    background:var(--panel);
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.tile{
    background:var(--tile);
    border:none;
    border-radius:12px;
    min-height:90px;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:10px;
    transition:.2s;
}

.tile:hover{
    background:var(--tile-hover);
}

.tile.selected{
    background:var(--selected);
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button.action{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.submit{
    background:#22c55e;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

.groups{
    margin-bottom:20px;
}

.group-found{
    padding:15px;
    margin-bottom:10px;
    border-radius:12px;
    color:#111;
}

.feedback{
    margin-top:15px;
    text-align:center;
    min-height:30px;
    font-weight:bold;
}

.endscreen{
    display:none;
    text-align:center;
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container">

<h1>⚓ Conexo do Porto</h1>
<div class="subtitle">
Escolha a edição
</div>
<div class="containera">
<a href="conexodoporto1.html"> Setembro 2026 </a><br>
<a href="conexodoporto2.html"> Outubro 2026 </a>
</div>


</body>
</html>
